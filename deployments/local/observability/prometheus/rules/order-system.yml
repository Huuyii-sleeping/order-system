groups:
  - name: order-system-slo-recording
    rules:
      # SLO 只衡量用户和机器客户端真正调用的业务接口。探针与指标抓取
      # 由 TargetDown 单独监控，不能用高频健康检查稀释业务请求失败率。
      - record: order_system:slo_eligible_requests:rate5m
        expr: |
          sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[5m]))

      - record: order_system:slo_eligible_requests:rate30m
        expr: |
          sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[30m]))

      # Availability 的 bad event 是 HTTP 5xx。4xx 表示服务正确完成了认证、
      # 参数校验或业务拒绝，因此不消耗可用性错误预算。
      - record: order_system:slo_error_ratio:rate5m
        labels:
          slo: http-availability
          objective: "0.999"
        expr: |
          (
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)",status=~"5.."}[5m]))
            /
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[5m]))
          )
          and on ()
          sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[5m])) > 0

      - record: order_system:slo_error_ratio:rate30m
        labels:
          slo: http-availability
          objective: "0.999"
        expr: |
          (
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)",status=~"5.."}[30m]))
            /
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[30m]))
          )
          and on ()
          sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[30m])) > 0

      - record: order_system:slo_error_ratio:rate1h
        labels:
          slo: http-availability
          objective: "0.999"
        expr: |
          (
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)",status=~"5.."}[1h]))
            /
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[1h]))
          )
          and on ()
          sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[1h])) > 0

      - record: order_system:slo_error_ratio:rate6h
        labels:
          slo: http-availability
          objective: "0.999"
        expr: |
          (
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)",status=~"5.."}[6h]))
            /
            sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[6h]))
          )
          and on ()
          sum(rate(order_system_http_requests_total{route!~"/(healthz|readyz|metrics)"}[6h])) > 0

      # Latency SLO 使用直方图中 le="0.5" 的累计桶作为 good event。
      # 这里衡量的是“在 500ms 内完成的请求比例”，不是 p95 瞬时值。
      - record: order_system:slo_error_ratio:rate5m
        labels:
          slo: http-latency
          objective: "0.99"
        expr: |
          (
            1 -
            sum(rate(order_system_http_request_duration_seconds_bucket{route!~"/(healthz|readyz|metrics)",le="0.5"}[5m]))
            /
            sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[5m]))
          )
          and on ()
          sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[5m])) > 0

      - record: order_system:slo_error_ratio:rate30m
        labels:
          slo: http-latency
          objective: "0.99"
        expr: |
          (
            1 -
            sum(rate(order_system_http_request_duration_seconds_bucket{route!~"/(healthz|readyz|metrics)",le="0.5"}[30m]))
            /
            sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[30m]))
          )
          and on ()
          sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[30m])) > 0

      - record: order_system:slo_error_ratio:rate1h
        labels:
          slo: http-latency
          objective: "0.99"
        expr: |
          (
            1 -
            sum(rate(order_system_http_request_duration_seconds_bucket{route!~"/(healthz|readyz|metrics)",le="0.5"}[1h]))
            /
            sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[1h]))
          )
          and on ()
          sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[1h])) > 0

      - record: order_system:slo_error_ratio:rate6h
        labels:
          slo: http-latency
          objective: "0.99"
        expr: |
          (
            1 -
            sum(rate(order_system_http_request_duration_seconds_bucket{route!~"/(healthz|readyz|metrics)",le="0.5"}[6h]))
            /
            sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[6h]))
          )
          and on ()
          sum(rate(order_system_http_request_duration_seconds_count{route!~"/(healthz|readyz|metrics)"}[6h])) > 0

  - name: order-system-slo-alerts
    rules:
      # 14.4 倍燃烧率约会在 1 小时内消耗 28 天预算的 2%。
      # 长短窗口同时超标，既发现持续影响，也要求故障此刻仍在发生。
      - alert: OrderSystemHTTPAvailabilityBudgetBurnFast
        expr: |
          (
            order_system:slo_error_ratio:rate1h{slo="http-availability"} / (1 - 0.999) > 14.4
            and on (slo, objective)
            order_system:slo_error_ratio:rate5m{slo="http-availability"} / (1 - 0.999) > 14.4
          )
          and on ()
          order_system:slo_eligible_requests:rate5m > 0.1
        labels:
          severity: critical
        annotations:
          summary: HTTP availability error budget is burning fast
          description: The 99.9 percent availability SLO is burning faster than 14.4 times budget in both the 1h and 5m windows.

      # 6 倍燃烧率约会在 6 小时内消耗 28 天预算的 5%。
      - alert: OrderSystemHTTPAvailabilityBudgetBurnSlow
        expr: |
          (
            order_system:slo_error_ratio:rate6h{slo="http-availability"} / (1 - 0.999) > 6
            and on (slo, objective)
            order_system:slo_error_ratio:rate30m{slo="http-availability"} / (1 - 0.999) > 6
          )
          and on ()
          order_system:slo_eligible_requests:rate30m > 0.05
        labels:
          severity: warning
        annotations:
          summary: HTTP availability error budget is burning persistently
          description: The 99.9 percent availability SLO is burning faster than 6 times budget in both the 6h and 30m windows.

      - alert: OrderSystemHTTPLatencyBudgetBurnFast
        expr: |
          (
            order_system:slo_error_ratio:rate1h{slo="http-latency"} / (1 - 0.99) > 14.4
            and on (slo, objective)
            order_system:slo_error_ratio:rate5m{slo="http-latency"} / (1 - 0.99) > 14.4
          )
          and on ()
          order_system:slo_eligible_requests:rate5m > 0.1
        labels:
          severity: critical
        annotations:
          summary: HTTP latency error budget is burning fast
          description: The 99 percent under 500ms latency SLO is burning faster than 14.4 times budget in both the 1h and 5m windows.

      - alert: OrderSystemHTTPLatencyBudgetBurnSlow
        expr: |
          (
            order_system:slo_error_ratio:rate6h{slo="http-latency"} / (1 - 0.99) > 6
            and on (slo, objective)
            order_system:slo_error_ratio:rate30m{slo="http-latency"} / (1 - 0.99) > 6
          )
          and on ()
          order_system:slo_eligible_requests:rate30m > 0.05
        labels:
          severity: warning
        annotations:
          summary: HTTP latency error budget is burning persistently
          description: The 99 percent under 500ms latency SLO is burning faster than 6 times budget in both the 6h and 30m windows.

  - name: order-system-availability
    rules:
      - alert: OrderSystemTargetDown
        expr: up{job="order-system"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Order System cannot be scraped
          description: Prometheus has been unable to scrape the Order System for one minute.

  - name: order-system-kafka
    rules:
      - alert: OrderSystemKafkaConsumerLagHigh
        expr: |
          max by (consumer_group, topic) (
            order_system_kafka_consumer_lag_records
          ) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Order System Kafka consumer lag is high
          description: A consumer group and topic have remained more than 100 records behind for five minutes.

      - alert: OrderSystemKafkaProcessingFailures
        expr: |
          sum by (consumer_group, topic) (
            increase(order_system_kafka_processing_attempts_total{outcome="failure"}[5m])
          ) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Order System Kafka handler is failing
          description: Kafka record handling failures have occurred during the last five minutes.

      - alert: OrderSystemKafkaOffsetCommitFailures
        expr: |
          sum by (consumer_group, topic) (
            increase(order_system_kafka_offset_commits_total{outcome="failure"}[5m])
          ) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Order System Kafka offset commits are failing
          description: Kafka offset commit failures have occurred during the last five minutes.

      - alert: OrderSystemKafkaDeadLettersPublished
        expr: |
          sum by (consumer_group, topic) (
            increase(order_system_kafka_dead_letters_published_total[5m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: Order System published a Kafka dead letter
          description: At least one record was isolated to a dead letter topic during the last five minutes.

  - name: order-system-database
    rules:
      - alert: OrderSystemDatabasePoolSaturated
        expr: |
          (
            max without (state) (order_system_database_pool_connections{state="in_use"})
            /
            clamp_min(order_system_database_pool_max_open_connections, 1)
          ) >= 0.9
          and on (instance, job)
          rate(order_system_database_pool_waits_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database connection pool is saturated
          description: At least 90 percent of database connections are in use and callers have waited for a connection for five minutes.

  - name: order-system-payment-provider
    rules:
      - alert: OrderSystemPaymentProviderCircuitOpen
        expr: order_system_payment_provider_circuit_state{state="open"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Payment provider circuit remains open
          description: The payment provider circuit has rejected calls for at least two minutes.

      - alert: OrderSystemPaymentProviderFailures
        expr: |
          sum(increase(order_system_payment_provider_requests_total{outcome=~"timeout|error|invalid_response"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Payment provider calls are failing
          description: Payment provider dependency failures have occurred during the last five minutes.

  - name: order-system-notification
    rules:
      - alert: OrderSystemNotificationRetries
        expr: sum(increase(order_system_notification_retries_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Order System notification delivery is retrying
          description: Notification tasks have encountered provider or response errors during the last five minutes.

      - alert: OrderSystemNotificationUnknown
        expr: sum(increase(order_system_notification_tasks_total{outcome="unknown"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Order System notification outcomes are unknown
          description: Notification delivery has encountered uncertain provider outcomes during the last five minutes and requires reconciliation.

      - alert: OrderSystemNotificationReconciliationErrors
        expr: sum(increase(order_system_notification_reconciliations_total{outcome="error"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Order System notification reconciliation is failing
          description: Notification provider result lookups have failed during the last five minutes.

      - alert: OrderSystemNotificationWebhookProcessingFailures
        expr: sum(increase(order_system_notification_webhooks_total{outcome=~"conflict|error"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Notification provider webhooks cannot be applied
          description: Signed notification callbacks have failed or conflicted with an existing terminal result during the last five minutes.

      - alert: OrderSystemNotificationWebhookAuthenticationFailures
        expr: sum(increase(order_system_notification_webhooks_total{outcome=~"invalid_signature|stale"}[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Notification webhook authentication failures are elevated
          description: More than ten notification callbacks failed signature or timestamp validation during the last five minutes.

  - name: order-system-maintenance
    rules:
      - alert: OrderSystemAuthCredentialCleanupFailures
        expr: sum(increase(order_system_auth_credential_cleanup_runs_total{outcome="error"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Authentication credential cleanup is failing
          description: The authentication credential cleanup worker has failed at least once during the last fifteen minutes.

      - alert: OrderSystemAuthCredentialCleanupStale
        expr: |
          (
            time() - order_system_auth_credential_cleanup_last_success_timestamp_seconds > 7200
          )
          or absent(order_system_auth_credential_cleanup_last_success_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Authentication credential cleanup is stale
          description: No successful authentication credential cleanup has been observed for more than two hours.
