rule_files:
  - ../rules/order-system.yml

evaluation_interval: 1m

tests:
  - name: target-down-becomes-critical-after-one-minute
    interval: 1m
    input_series:
      - series: 'up{job="order-system",instance="host.docker.internal:8080"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: OrderSystemTargetDown
        exp_alerts:
          - exp_labels:
              instance: host.docker.internal:8080
              job: order-system
              severity: critical
            exp_annotations:
              summary: Order System cannot be scraped
              description: Prometheus has been unable to scrape the Order System for one minute.

  - name: healthy-target-does-not-alert
    interval: 1m
    input_series:
      - series: 'up{job="order-system",instance="host.docker.internal:8080"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: OrderSystemTargetDown
        exp_alerts: []

  - name: fast-slo-burn-records-slis-and-alerts
    interval: 1m
    input_series:
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="200"}'
        values: '0+588x75'
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="500"}'
        values: '0+12x75'
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/orders/{orderID}",le="0.5"}'
        values: '0+450x75'
      - series: 'order_system_http_request_duration_seconds_count{method="GET",route="/orders/{orderID}"}'
        values: '0+600x75'
      # 即使探针持续失败，也不能进入用户请求的 SLI 分母或分子。
      - series: 'order_system_http_requests_total{method="GET",route="/healthz",status="500"}'
        values: '0+6000x75'
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/healthz",le="0.5"}'
        values: '0x75'
      - series: 'order_system_http_request_duration_seconds_count{method="GET",route="/healthz"}'
        values: '0+6000x75'
    promql_expr_test:
      - expr: order_system:slo_eligible_requests:rate5m
        eval_time: 70m
        exp_samples:
          - labels: 'order_system:slo_eligible_requests:rate5m{}'
            value: 10
      - expr: 'order_system:slo_error_ratio:rate5m{slo="http-availability"}'
        eval_time: 70m
        exp_samples:
          - labels: 'order_system:slo_error_ratio:rate5m{objective="0.999",slo="http-availability"}'
            value: 0.02
      - expr: 'order_system:slo_error_ratio:rate5m{slo="http-latency"}'
        eval_time: 70m
        exp_samples:
          - labels: 'order_system:slo_error_ratio:rate5m{objective="0.99",slo="http-latency"}'
            value: 0.25
    alert_rule_test:
      - eval_time: 70m
        alertname: OrderSystemHTTPAvailabilityBudgetBurnFast
        exp_alerts:
          - exp_labels:
              objective: "0.999"
              severity: critical
              slo: http-availability
            exp_annotations:
              summary: HTTP availability error budget is burning fast
              description: The 99.9 percent availability SLO is burning faster than 14.4 times budget in both the 1h and 5m windows.
      - eval_time: 70m
        alertname: OrderSystemHTTPLatencyBudgetBurnFast
        exp_alerts:
          - exp_labels:
              objective: "0.99"
              severity: critical
              slo: http-latency
            exp_annotations:
              summary: HTTP latency error budget is burning fast
              description: The 99 percent under 500ms latency SLO is burning faster than 14.4 times budget in both the 1h and 5m windows.

  - name: persistent-moderate-slo-burn-alerts-on-slow-windows
    interval: 1m
    input_series:
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="200"}'
        values: '0+594x430'
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="500"}'
        values: '0+6x430'
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/orders/{orderID}",le="0.5"}'
        values: '0+552x430'
      - series: 'order_system_http_request_duration_seconds_count{method="GET",route="/orders/{orderID}"}'
        values: '0+600x430'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderSystemHTTPAvailabilityBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              objective: "0.999"
              severity: warning
              slo: http-availability
            exp_annotations:
              summary: HTTP availability error budget is burning persistently
              description: The 99.9 percent availability SLO is burning faster than 6 times budget in both the 6h and 30m windows.
      - eval_time: 7h
        alertname: OrderSystemHTTPLatencyBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              objective: "0.99"
              severity: warning
              slo: http-latency
            exp_annotations:
              summary: HTTP latency error budget is burning persistently
              description: The 99 percent under 500ms latency SLO is burning faster than 6 times budget in both the 6h and 30m windows.

  - name: healthy-slo-does-not-alert
    interval: 1m
    input_series:
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="200"}'
        values: '0+600x430'
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="500"}'
        values: '0x430'
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/orders/{orderID}",le="0.5"}'
        values: '0+600x430'
      - series: 'order_system_http_request_duration_seconds_count{method="GET",route="/orders/{orderID}"}'
        values: '0+600x430'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderSystemHTTPAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderSystemHTTPAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderSystemHTTPLatencyBudgetBurnFast
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderSystemHTTPLatencyBudgetBurnSlow
        exp_alerts: []

  - name: low-traffic-slo-does-not-page-on-one-failure-per-minute
    interval: 1m
    input_series:
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="500"}'
        values: '0+1x430'
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/orders/{orderID}",le="0.5"}'
        values: '0x430'
      - series: 'order_system_http_request_duration_seconds_count{method="GET",route="/orders/{orderID}"}'
        values: '0+1x430'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderSystemHTTPAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderSystemHTTPAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderSystemHTTPLatencyBudgetBurnFast
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderSystemHTTPLatencyBudgetBurnSlow
        exp_alerts: []

  - name: transient-small-lag-does-not-alert
    interval: 1m
    input_series:
      - series: 'order_system_kafka_consumer_lag_records{consumer_group="payments-v1",topic="orders.created.v1",partition="0"}'
        values: '20x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: OrderSystemKafkaConsumerLagHigh
        exp_alerts: []

  - name: sustained-consumer-lag-alerts
    interval: 1m
    input_series:
      - series: 'order_system_kafka_consumer_lag_records{consumer_group="payments-v1",topic="orders.created.v1",partition="0"}'
        values: '150x12'
    alert_rule_test:
      - eval_time: 8m
        alertname: OrderSystemKafkaConsumerLagHigh
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: warning
            exp_annotations:
              summary: Order System Kafka consumer lag is high
              description: A consumer group and topic have remained more than 100 records behind for five minutes.

  - name: dead-letter-alerts-with-source-labels
    interval: 1m
    input_series:
      - series: 'order_system_kafka_dead_letters_published_total{consumer_group="payments-v1",topic="orders.created.v1"}'
        values: '0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderSystemKafkaDeadLettersPublished
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: critical
            exp_annotations:
              summary: Order System published a Kafka dead letter
              description: At least one record was isolated to a dead letter topic during the last five minutes.

  - name: kafka-processing-and-offset-failures-alert
    interval: 1m
    input_series:
      - series: 'order_system_kafka_processing_attempts_total{consumer_group="payments-v1",topic="orders.created.v1",outcome="failure"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_kafka_offset_commits_total{consumer_group="payments-v1",topic="orders.created.v1",outcome="failure"}'
        values: '0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemKafkaProcessingFailures
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: warning
            exp_annotations:
              summary: Order System Kafka handler is failing
              description: Kafka record handling failures have occurred during the last five minutes.
      - eval_time: 4m
        alertname: OrderSystemKafkaOffsetCommitFailures
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: critical
            exp_annotations:
              summary: Order System Kafka offset commits are failing
              description: Kafka offset commit failures have occurred during the last five minutes.

  - name: sustained-open-payment-circuit-alerts
    interval: 1m
    input_series:
      - series: 'order_system_payment_provider_circuit_state{state="open"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderSystemPaymentProviderCircuitOpen
        exp_alerts:
          - exp_labels:
              state: open
              severity: critical
            exp_annotations:
              summary: Payment provider circuit remains open
              description: The payment provider circuit has rejected calls for at least two minutes.

  - name: transient-open-payment-circuit-does-not-alert
    interval: 1m
    input_series:
      - series: 'order_system_payment_provider_circuit_state{state="open"}'
        values: '0 1 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderSystemPaymentProviderCircuitOpen
        exp_alerts: []

  - name: sustained-database-pool-saturation-alerts
    interval: 1m
    input_series:
      - series: 'order_system_database_pool_connections{state="in_use"}'
        values: '18x12'
      - series: 'order_system_database_pool_max_open_connections'
        values: '20x12'
      - series: 'order_system_database_pool_waits_total'
        values: '0+60x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: OrderSystemDatabasePoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Database connection pool is saturated
              description: At least 90 percent of database connections are in use and callers have waited for a connection for five minutes.

  - name: busy-database-pool-without-waits-does-not-alert
    interval: 1m
    input_series:
      - series: 'order_system_database_pool_connections{state="in_use"}'
        values: '18x12'
      - series: 'order_system_database_pool_max_open_connections'
        values: '20x12'
      - series: 'order_system_database_pool_waits_total'
        values: '0x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: OrderSystemDatabasePoolSaturated
        exp_alerts: []

  - name: payment-provider-failures-alert
    interval: 1m
    input_series:
      - series: 'order_system_payment_provider_requests_total{outcome="timeout"}'
        values: '0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemPaymentProviderFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Payment provider calls are failing
              description: Payment provider dependency failures have occurred during the last five minutes.

  - name: notification-retries-and-unknown-outcomes-alert
    interval: 1m
    input_series:
      - series: 'order_system_notification_retries_total{reason="provider_error"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_notification_tasks_total{outcome="unknown"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_notification_reconciliations_total{outcome="error"}'
        values: '0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemNotificationRetries
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order System notification delivery is retrying
              description: Notification tasks have encountered provider or response errors during the last five minutes.
      - eval_time: 4m
        alertname: OrderSystemNotificationUnknown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Order System notification outcomes are unknown
              description: Notification delivery has encountered uncertain provider outcomes during the last five minutes and requires reconciliation.
      - eval_time: 4m
        alertname: OrderSystemNotificationReconciliationErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order System notification reconciliation is failing
              description: Notification provider result lookups have failed during the last five minutes.

  - name: notification-webhook-failures-alert
    interval: 1m
    input_series:
      - series: 'order_system_notification_webhooks_total{outcome="conflict"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_notification_webhooks_total{outcome="invalid_signature"}'
        values: '0 6 12 18 24 30'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemNotificationWebhookProcessingFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Notification provider webhooks cannot be applied
              description: Signed notification callbacks have failed or conflicted with an existing terminal result during the last five minutes.
      - eval_time: 4m
        alertname: OrderSystemNotificationWebhookAuthenticationFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Notification webhook authentication failures are elevated
              description: More than ten notification callbacks failed signature or timestamp validation during the last five minutes.

  - name: authentication-credential-cleanup-failure-alert
    interval: 1m
    input_series:
      - series: 'order_system_auth_credential_cleanup_runs_total{outcome="error"}'
        values: '0 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 8m
        alertname: OrderSystemAuthCredentialCleanupFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Authentication credential cleanup is failing
              description: The authentication credential cleanup worker has failed at least once during the last fifteen minutes.

  - name: authentication-credential-cleanup-stale-alert
    interval: 1m
    input_series:
      - series: 'order_system_auth_credential_cleanup_last_success_timestamp_seconds'
        values: '0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: OrderSystemAuthCredentialCleanupStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Authentication credential cleanup is stale
              description: No successful authentication credential cleanup has been observed for more than two hours.

  - name: authentication-credential-cleanup-never-started-alert
    interval: 1m
    alert_rule_test:
      - eval_time: 30m
        alertname: OrderSystemAuthCredentialCleanupStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Authentication credential cleanup is stale
              description: No successful authentication credential cleanup has been observed for more than two hours.
