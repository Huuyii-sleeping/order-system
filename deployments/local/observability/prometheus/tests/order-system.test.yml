rule_files:
  - ../rules/order-system.yml

evaluation_interval: 1m

tests:
  - name: target-down-becomes-critical-after-one-minute
    interval: 1m
    input_series:
      - series: 'up{job="order-system",instance="host.docker.internal:8080"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: OrderSystemTargetDown
        exp_alerts:
          - exp_labels:
              instance: host.docker.internal:8080
              job: order-system
              severity: critical
            exp_annotations:
              summary: Order System cannot be scraped
              description: Prometheus has been unable to scrape the Order System for one minute.

  - name: healthy-target-does-not-alert
    interval: 1m
    input_series:
      - series: 'up{job="order-system",instance="host.docker.internal:8080"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: OrderSystemTargetDown
        exp_alerts: []

  - name: sustained-http-error-ratio-alerts
    interval: 1m
    input_series:
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="200"}'
        values: '0+18x12'
      - series: 'order_system_http_requests_total{method="GET",route="/orders/{orderID}",status="500"}'
        values: '0+2x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: OrderSystemHighHTTPErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order System HTTP 5xx rate is high
              description: More than 5 percent of HTTP requests have returned 5xx for five minutes.

  - name: sustained-http-p95-latency-alerts
    interval: 1m
    input_series:
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/orders/{orderID}",le="0.5"}'
        values: '0x12'
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/orders/{orderID}",le="0.75"}'
        values: '0+60x12'
      - series: 'order_system_http_request_duration_seconds_bucket{method="GET",route="/orders/{orderID}",le="+Inf"}'
        values: '0+60x12'
      - series: 'order_system_http_request_duration_seconds_count{method="GET",route="/orders/{orderID}"}'
        values: '0+60x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: OrderSystemHighP95Latency
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order System HTTP p95 latency is high
              description: The overall HTTP p95 latency has exceeded 500 milliseconds for five minutes.

  - name: transient-small-lag-does-not-alert
    interval: 1m
    input_series:
      - series: 'order_system_kafka_consumer_lag_records{consumer_group="payments-v1",topic="orders.created.v1",partition="0"}'
        values: '20x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: OrderSystemKafkaConsumerLagHigh
        exp_alerts: []

  - name: sustained-consumer-lag-alerts
    interval: 1m
    input_series:
      - series: 'order_system_kafka_consumer_lag_records{consumer_group="payments-v1",topic="orders.created.v1",partition="0"}'
        values: '150x12'
    alert_rule_test:
      - eval_time: 8m
        alertname: OrderSystemKafkaConsumerLagHigh
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: warning
            exp_annotations:
              summary: Order System Kafka consumer lag is high
              description: A consumer group and topic have remained more than 100 records behind for five minutes.

  - name: dead-letter-alerts-with-source-labels
    interval: 1m
    input_series:
      - series: 'order_system_kafka_dead_letters_published_total{consumer_group="payments-v1",topic="orders.created.v1"}'
        values: '0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderSystemKafkaDeadLettersPublished
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: critical
            exp_annotations:
              summary: Order System published a Kafka dead letter
              description: At least one record was isolated to a dead letter topic during the last five minutes.

  - name: kafka-processing-and-offset-failures-alert
    interval: 1m
    input_series:
      - series: 'order_system_kafka_processing_attempts_total{consumer_group="payments-v1",topic="orders.created.v1",outcome="failure"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_kafka_offset_commits_total{consumer_group="payments-v1",topic="orders.created.v1",outcome="failure"}'
        values: '0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemKafkaProcessingFailures
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: warning
            exp_annotations:
              summary: Order System Kafka handler is failing
              description: Kafka record handling failures have occurred during the last five minutes.
      - eval_time: 4m
        alertname: OrderSystemKafkaOffsetCommitFailures
        exp_alerts:
          - exp_labels:
              consumer_group: payments-v1
              topic: orders.created.v1
              severity: critical
            exp_annotations:
              summary: Order System Kafka offset commits are failing
              description: Kafka offset commit failures have occurred during the last five minutes.

  - name: sustained-open-payment-circuit-alerts
    interval: 1m
    input_series:
      - series: 'order_system_payment_provider_circuit_state{state="open"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderSystemPaymentProviderCircuitOpen
        exp_alerts:
          - exp_labels:
              state: open
              severity: critical
            exp_annotations:
              summary: Payment provider circuit remains open
              description: The payment provider circuit has rejected calls for at least two minutes.

  - name: transient-open-payment-circuit-does-not-alert
    interval: 1m
    input_series:
      - series: 'order_system_payment_provider_circuit_state{state="open"}'
        values: '0 1 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderSystemPaymentProviderCircuitOpen
        exp_alerts: []

  - name: payment-provider-failures-alert
    interval: 1m
    input_series:
      - series: 'order_system_payment_provider_requests_total{outcome="timeout"}'
        values: '0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemPaymentProviderFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Payment provider calls are failing
              description: Payment provider dependency failures have occurred during the last five minutes.

  - name: notification-retries-and-unknown-outcomes-alert
    interval: 1m
    input_series:
      - series: 'order_system_notification_retries_total{reason="provider_error"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_notification_tasks_total{outcome="unknown"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_notification_reconciliations_total{outcome="error"}'
        values: '0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemNotificationRetries
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order System notification delivery is retrying
              description: Notification tasks have encountered provider or response errors during the last five minutes.
      - eval_time: 4m
        alertname: OrderSystemNotificationUnknown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Order System notification outcomes are unknown
              description: Notification delivery has encountered uncertain provider outcomes during the last five minutes and requires reconciliation.
      - eval_time: 4m
        alertname: OrderSystemNotificationReconciliationErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order System notification reconciliation is failing
              description: Notification provider result lookups have failed during the last five minutes.

  - name: notification-webhook-failures-alert
    interval: 1m
    input_series:
      - series: 'order_system_notification_webhooks_total{outcome="conflict"}'
        values: '0 1 1 1 1 1'
      - series: 'order_system_notification_webhooks_total{outcome="invalid_signature"}'
        values: '0 6 12 18 24 30'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderSystemNotificationWebhookProcessingFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Notification provider webhooks cannot be applied
              description: Signed notification callbacks have failed or conflicted with an existing terminal result during the last five minutes.
      - eval_time: 4m
        alertname: OrderSystemNotificationWebhookAuthenticationFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Notification webhook authentication failures are elevated
              description: More than ten notification callbacks failed signature or timestamp validation during the last five minutes.

  - name: authentication-credential-cleanup-failure-alert
    interval: 1m
    input_series:
      - series: 'order_system_auth_credential_cleanup_runs_total{outcome="error"}'
        values: '0 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 8m
        alertname: OrderSystemAuthCredentialCleanupFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Authentication credential cleanup is failing
              description: The authentication credential cleanup worker has failed at least once during the last fifteen minutes.

  - name: authentication-credential-cleanup-stale-alert
    interval: 1m
    input_series:
      - series: 'order_system_auth_credential_cleanup_last_success_timestamp_seconds'
        values: '0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: OrderSystemAuthCredentialCleanupStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Authentication credential cleanup is stale
              description: No successful authentication credential cleanup has been observed for more than two hours.

  - name: authentication-credential-cleanup-never-started-alert
    interval: 1m
    alert_rule_test:
      - eval_time: 30m
        alertname: OrderSystemAuthCredentialCleanupStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Authentication credential cleanup is stale
              description: No successful authentication credential cleanup has been observed for more than two hours.
