apiVersion: v1
kind: ConfigMap
metadata:
  name: order-system-runtime
  labels:
    app.kubernetes.io/name: order-system
data:
  APP_NAME: order-system
  HTTP_ADDR: ":8080"
  STORAGE_DRIVER: postgres
  DATABASE_MAX_OPEN_CONNS: "20"
  DATABASE_MAX_IDLE_CONNS: "5"
  DATABASE_CONN_MAX_LIFETIME: 30m
  DATABASE_CONN_MAX_IDLE_TIME: 5m
  CACHE_DRIVER: redis
  MESSAGE_DRIVER: kafka
  KAFKA_BROKERS: redpanda:9092
  KAFKA_CONSUMER_GROUP: order-system-payments-v1
  KAFKA_DEAD_LETTER_TOPIC: orders.created.v1.dlq
  SECURE_COOKIES: "true"
  SHUTDOWN_TIMEOUT: 30s
  SHUTDOWN_DRAIN_DELAY: 2s
  READINESS_TIMEOUT: 2s
