name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Verify module checksums
        run: go mod verify

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

  observability:
    name: Observability checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Prometheus and Tempo configuration
        run: make observability-check

  kubernetes:
    name: Kubernetes manifest checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Render Kubernetes manifests
        run: make kubernetes-check

  contract:
    name: API and event contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify HTTP and event contracts
        run: make contract-check

  container:
    name: Container build
    needs: [go, observability, kubernetes, contract]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --pull --tag order-system:ci .

      - name: Verify non-root release image
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' order-system:ci)" = "app"
          docker run --rm --entrypoint /bin/sh order-system:ci -c \
            'test "$(id -u)" -ne 0 && test -x /app/api && test -x /app/migrate'

  integration:
    name: Real infrastructure integration
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration and dependency outage checks
        run: make integration-check

  database-recovery:
    name: Database backup and restore
    needs: [integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify migration integrity and database recovery
        run: make database-recovery-check

  performance:
    name: HTTP performance baseline
    needs: [integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run isolated performance baseline
        run: make performance-check

  rollout:
    name: Rollout and rollback smoke check
    needs: [go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify local rollout and rollback sequence
        run: make rollout-check

  release-readiness:
    name: Release readiness matrix
    needs: [database-recovery, performance, rollout]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all automated release gates passed
        run: echo "release readiness automated matrix passed"
