name: order-system

services:
  migrate:
    profiles: ["application"]
    build:
      context: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://order_system:order_system@postgres:5432/order_system?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  broker-init:
    profiles: ["application"]
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rpk -X brokers=redpanda:9092 topic create orders.created.v1 --partitions 3 --replicas 1 --if-not-exists
        rpk -X brokers=redpanda:9092 topic create payments.succeeded.v1 --partitions 3 --replicas 1 --if-not-exists
        rpk -X brokers=redpanda:9092 topic create payments.failed.v1 --partitions 3 --replicas 1 --if-not-exists
        rpk -X brokers=redpanda:9092 topic create notifications.requested.v1 --partitions 3 --replicas 1 --if-not-exists
        rpk -X brokers=redpanda:9092 topic create orders.created.v1.dlq --partitions 3 --replicas 1 --if-not-exists
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["application"]
    build:
      context: .
    environment:
      HTTP_ADDR: :8080
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://order_system:order_system@postgres:5432/order_system?sslmode=disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
      DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-5m}
      CACHE_DRIVER: redis
      REDIS_URL: redis://redis:6379/0
      MESSAGE_DRIVER: kafka
      KAFKA_BROKERS: redpanda:9092
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      NOTIFICATION_WEBHOOK_TOLERANCE: ${NOTIFICATION_WEBHOOK_TOLERANCE:-5m}
      SIMULATED_NOTIFICATION_RESPONSE_LOSSES: ${SIMULATED_NOTIFICATION_RESPONSE_LOSSES:-0}
      SHUTDOWN_TIMEOUT: 10s
      SHUTDOWN_DRAIN_DELAY: 2s
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    # 覆盖应用排水预算，并为 Trace 刷新和资源关闭保留余量。
    stop_grace_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_system
      POSTGRES_USER: order_system
      POSTGRES_PASSWORD: order_system
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_system -d order_system"]
      interval: 2s
      timeout: 3s
      retries: 15

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${KAFKA_HOST_PORT:-19092}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deployments/local/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  tempo:
    image: grafana/tempo:2.7.2
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./deployments/local/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deployments/local/observability/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./deployments/local/observability/grafana/provisioning/dashboards/order-system.yml:/etc/grafana/provisioning/dashboards/order-system.yml:ro
      - ./deployments/local/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redpanda-data:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
