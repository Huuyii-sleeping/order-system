name: order-system

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_system
      POSTGRES_USER: order_system
      POSTGRES_PASSWORD: order_system
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_system -d order_system"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
